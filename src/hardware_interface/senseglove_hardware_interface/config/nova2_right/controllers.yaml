controller:
  joint_state:
    type: joint_state_controller/JointStateController
    publish_rate: 30
  hand_state:
    type: joint_state_controller/JointStateController
    publish_rate: 30
  trajectory:
    type: position_controllers/JointTrajectoryController
    allow_partial_joints_goal: true
    joints:
      - r_thumb_brake   # FFB
      - r_index_brake   # FFB
      - r_middle_brake  # FFB
      - r_ring_brake    # FFB
      - r_thumb_dip   # Buzzer
      - r_index_dip   # Buzzer
      - r_palm_index  # Buzzer - Palm-Index Side
      - r_palm_pinky  # Buzzer - Palm-Pinky Side
      - r_palm_strap  # Palm Strap