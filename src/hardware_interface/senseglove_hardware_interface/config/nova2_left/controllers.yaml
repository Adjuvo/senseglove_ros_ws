controller:
  joint_state:
    type: joint_state_controller/JointStateController
    publish_rate: 30
  hand_state:
    type: joint_state_controller/JointStateController
    publish_rate: 30
  trajectory:
    type: position_controllers/JointTrajectoryController
    allow_partial_joints_goal: true
    joints:
      - l_thumb_brake   # FFB
      - l_index_brake   # FFB
      - l_middle_brake  # FFB
      - l_ring_brake    # FFB
      - l_thumb_dip   # Buzzer
      - l_index_dip   # Buzzer
      - l_palm_index  # Buzzer - Palm-Index Side
      - l_palm_pinky  # Buzzer - Palm-Pinky Side
      - l_palm_strap  # Palm Strap
      