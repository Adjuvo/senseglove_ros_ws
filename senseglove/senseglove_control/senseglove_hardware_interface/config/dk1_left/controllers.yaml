controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      name: joint_state_broadcaster

    trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      name: trajectory_controller
      joints:
        - l_thumb_brake   # FFB
        - l_index_brake   # FFB
        - l_middle_brake  # FFB
        - l_ring_brake    # FFB
        - l_pinky_brake   # FFB
        - l_thumb_dip   # Buzzer
        - l_index_dip   # Buzzer
        - l_middle_dip  # Buzzer
        - l_ring_dip    # Buzzer
        - l_pinky_dip   # Buzzer
