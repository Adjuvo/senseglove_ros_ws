/**/controller_manager:
  ros__parameters:
    update_rate: 60    

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/**/haptics_controller:
  ros__parameters:
    type: forward_command_controller/ForwardCommandController
    joints:
      - l_thumb_brake   # FFB
      - l_index_brake   # FFB
      - l_middle_brake  # FFB
      - l_ring_brake    # FFB
      - l_thumb_dip     # Buzzer
      - l_index_dip     # Buzzer
      - l_palm_index    # Buzzer - Palm-Index Side
      - l_palm_pinky    # Buzzer - Palm-Pinky Side
      - l_palm_strap    # Palm Strap
    interface_name: effort